<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:white;
    color:#0f0e0e;
}

/* Header */
header{
    height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 80px;
}

.logo{
    font-size:22px;
    font-weight:800;
    font-style:italic;
    letter-spacing:1px;
}

nav{
    display:flex;
    align-items:center;
    gap:35px;
}

nav a{
    text-decoration:none;
    color:#222;
    font-size:14px;
}

.btn{
    padding:14px 25px;
    border:2px solid #222;
    background:white;
    font-weight:bold;
    cursor:pointer;
}


/* Hero Section */

.hero{
    text-align:center;
    padding-top:70px;
}

.small-title{
    font-size:13px;
    font-weight:bold;
    letter-spacing:3px;
    color:#555;
    margin-bottom:20px;
}

h1{
    font-family: Georgia, serif;
    font-size:48px;
    line-height:1.2;
    max-width:800px;
    margin:auto;
}

.description{
    margin-top:20px;
    font-size:16px;
    color:#444;
    line-height:1.6;
}

.learn{
    margin-top:30px;
    padding:14px 35px;
    border:2px solid black;
    background:white;
    font-weight:bold;
    box-shadow:5px 5px 0 black;
}


/* Brand section */

.brands{
    margin-top:120px;
    display:flex;
    justify-content:center;
    gap:80px;
    align-items:center;
}

.brand{
    font-size:25px;
    font-weight:bold;
    color:#333;
}

.juniper{
    font-weight:normal;
    color:#777;
}

.hubspot{
    font-size:22px;
}

.netflix{
    letter-spacing:2px;
}


/* responsive */

@media(max-width:800px){

header{
    padding:20px;
}

nav{
    display:none;
}

h1{
    font-size:35px;
}

.brands{
    flex-wrap:wrap;
    gap:30px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
GENERATOR
</div>

<nav>
<a href="#">Home</a>

<a href="#">Pages ▾</a>

<a href="#">Blog Templates ▾</a>

<button class="btn">
Install Theme
</button>

</nav>

</header>



<section class="hero">

<div class="small-title">
HOME PAGE
</div>


<h1>
Build and manage your HubSpot<br>
website without code.
</h1>


<p class="description">
This HubSpot website theme provides marketers with the tools they need to build modern<br>
websites, landing pages and blog on HubSpot without a developer.
</p>


<button class="learn">
Learn more
</button>


</section>



<section class="brands">

<div class="brand">
LACOSTE
</div>

<div class="brand juniper">
juniper
</div>

<div class="brand hubspot">
HubSpot
</div>

<div class="brand netflix">
NETFLIX
</div>


</section>


</body>
</html>
