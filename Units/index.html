<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link rel="stylesheet" href="Style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div id="container">

        <div class="top"></div>

        <div class="profile">
            <img src="https://img.freepik.com/premium-photo/profile-icon-white-background_941097-162014.jpg?w=996"
                alt="Profile">
        </div>

        <div class="content">

            <h2>CodingLab</h2>
            <p>YouTuber & Blogger</p>

            <div class="social">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>

            <div class="buttons">
                <button>Subscribe</button>
                <button>Message</button>
            </div>

            <div class="stats">
                <span><i class="fa-regular fa-heart"></i> 60.4k</span>
                <span><i class="fa-regular fa-comment"></i> 20k</span>
                <span><i class="fa-solid fa-share"></i> 12.4k</span>
            </div>

        </div>

    </div>

</body>
</html>
